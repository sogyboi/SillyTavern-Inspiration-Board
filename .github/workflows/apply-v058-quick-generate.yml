name: Apply v0.5.8 Quick Generate wiring

on:
  push:
    branches:
      - feature/v0.5.8-quick-generate
    paths:
      - ibv058-quick-generate-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.5.8-quick-generate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply product wiring
        run: python tools/apply_v058.py
      - name: Verify full extension
        run: |
          npm test
          npm run check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openrouter-gen-v58.js server-plugin/inspiration-board-sync/index.mjs CHANGELOG.md OPENROUTER_IMAGE_GENERATION.md
          git commit -m "Wire v0.5.8 Quick Generate to OpenRouter Images API"
          git push origin HEAD:feature/v0.5.8-quick-generate

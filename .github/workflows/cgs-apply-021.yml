name: Apply Character Gallery 0.2.1
on:
  push:
    branches: [cgs-v021-venice-full-catalog]
    paths:
      - '.github/workflows/cgs-apply-021.yml'
      - 'tools/.apply-cgs-021.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cgs-v021-venice-full-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply catalog update
        run: python tools/.apply-cgs-021.py
      - name: Verify regression suite and syntax
        run: |
          npm test
          npm run check
          bash -n tools/install-plugin.sh
          bash -n tools/install-termux.sh
      - name: Commit verified product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md index.js manifest.json package.json style.css server-plugin tests
          git commit -m 'Character Gallery Studio 0.2.1: show full Venice model catalog'
          git push origin HEAD:cgs-v021-venice-full-catalog

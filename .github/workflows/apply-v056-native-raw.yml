name: Apply v0.5.6 native raw transport

on:
  push:
    branches:
      - hotfix/v0.5.6-native-raw-transport
    paths:
      - ibv056-native-raw-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.5.6-native-raw-transport
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply v0.5.6 patch
        run: |
          python tools/apply_v056_native_raw.py
          python tools/repair_v056_stale_test.py
      - name: Verify extension and server plugin
        run: |
          npm test
          npm run check
      - name: Verify Android APK
        run: gradle -p android-companion :app:assembleDebug
      - name: Commit verified product changes
        run: |
          rm -rf android-companion/.gradle android-companion/app/build
          git checkout HEAD -- .github/workflows/apply-v056-native-raw.yml ibv056-native-raw-trigger.txt tools/apply_v056_native_raw.py tools/repair_v056_stale_test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hotfix v0.5.6 verified native raw transport"
          git push origin HEAD:hotfix/v0.5.6-native-raw-transport

name: Apply v0.6.1 Venice reference integrity

on:
  push:
    branches:
      - feature/v0.6.1-reference-integrity
    paths:
      - ibv061-reference-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.1-reference-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repair patch anchor
        run: python tools/repair_v061_reference_patcher.py
      - name: Apply v0.6.1 product patch
        run: python tools/apply_v061_reference_integrity.py
      - name: Verify repository
        run: |
          npm test
          npm run check
      - name: Commit verified v0.6.1 product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            launcher-v61.js \
            venice-gen-v61.js \
            manifest.json \
            package.json \
            CHANGELOG.md \
            tests/venice-media-v060.test.mjs \
            tests/venice-reference-v061.test.mjs \
            server-plugin/inspiration-board-sync/index.mjs \
            server-plugin/inspiration-board-sync/package.json \
            server-plugin/inspiration-board-sync/venice-media-v61.mjs
          git commit -m "Release v0.6.1 Venice reference integrity"
          git push origin HEAD:feature/v0.6.1-reference-integrity

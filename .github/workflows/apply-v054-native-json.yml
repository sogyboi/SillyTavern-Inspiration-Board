name: Apply v0.5.4 native JSON hotfix

on:
  push:
    branches:
      - hotfix/v0.5.4-native-json
    paths:
      - ibv054-native-json-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.5.4-native-json
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply v0.5.4 patch
        run: |
          python tools/repair_v054_patch.py
          python tools/apply_v054_native_json.py
      - name: Verify extension and server plugin
        run: |
          npm test
          npm run check
      - name: Verify Android APK
        run: gradle -p android-companion :app:assembleDebug
      - name: Commit verified hotfix
        run: |
          rm -rf android-companion/.gradle android-companion/app/build
          git checkout HEAD -- .github/workflows/apply-v054-native-json.yml ibv054-native-json-trigger.txt tools/apply_v054_native_json.py tools/repair_v054_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hotfix v0.5.4 native JSON capture"
          git push origin HEAD:hotfix/v0.5.4-native-json

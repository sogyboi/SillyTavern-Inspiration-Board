name: Character Gallery Studio
on:
  push:
    branches: [character-gallery-studio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Package installable extension
        run: zip -r Character-Gallery-Studio-v0.1.0.zip manifest.json index.js style.css README.md LICENSE CHANGELOG.md package.json server-plugin tools tests
      - uses: actions/upload-artifact@v4
        with:
          name: Character-Gallery-Studio-v0.1.0
          path: Character-Gallery-Studio-v0.1.0.zip

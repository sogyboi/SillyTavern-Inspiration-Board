name: Apply v0.5.7 OpenRouter pricing and status

on:
  push:
    branches:
      - feature/v0.5.7-pricing-status
    paths:
      - ibv057-pricing-status-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.5.7-pricing-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply v0.5.7 patch
        run: |
          python tools/repair_v057_script.py
          python tools/apply_v057.py
          python tools/repair_v057_tests.py
      - name: Verify
        run: |
          npm test
          npm run check
      - name: Commit verified product changes
        run: |
          git checkout HEAD -- .github/workflows/apply-v057-pricing-status.yml ibv057-pricing-status-trigger.txt tools/apply_v057.py tools/repair_v057_script.py tools/repair_v057_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v0.5.7 OpenRouter pricing and generation status"
          git push origin HEAD:feature/v0.5.7-pricing-status

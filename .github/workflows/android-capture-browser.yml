name: Android Capture Browser

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-capture-browser.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-capture-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: |
          gradle -p android-companion :app:assembleDebug
          cp android-companion/app/build/outputs/apk/debug/app-debug.apk InspirationBoard-CaptureBrowser-v0.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InspirationBoard-CaptureBrowser-v0.5.0
          path: InspirationBoard-CaptureBrowser-v0.5.0.apk
      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="capture-browser-v0.5.0"
          APK="InspirationBoard-CaptureBrowser-v0.5.0.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Inspiration Board Capture Browser v0.5.0" \
              --notes "Android companion browser for Inspiration Board. Browse Pinterest/Cosmos in a WebView with a draggable floating save button. If a provider blocks WebView, use App/Site and Android Share → Inspiration Board Inbox as the fallback. This first beta APK uses Android debug signing; later signing may require reinstalling the companion app."
          fi

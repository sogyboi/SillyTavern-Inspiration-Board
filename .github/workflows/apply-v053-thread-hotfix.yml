name: Apply v0.5.3 WebView thread hotfix

on:
  push:
    branches:
      - hotfix/v0.5.3-webview-thread
    paths:
      - ibv053-thread-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.5.3-webview-thread
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply patch
        run: |
          python tools/repair_v053_script.py
          python tools/apply_v053.py
          rm -f tools/repair_v053_script.py
      - name: Verify extension
        run: |
          npm test
          npm run check
      - name: Verify Android APK
        run: gradle -p android-companion :app:assembleDebug
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hotfix v0.5.3 WebView thread safety"
          git push origin HEAD:hotfix/v0.5.3-webview-thread

name: Apply v0.5.3 WebView thread hotfix

on:
  push:
    branches:
      - hotfix/v0.5.3-webview-thread
    paths:
      - ibv053-thread-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.5.3-webview-thread
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Capture Browser threading and bump v0.5.3
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {found}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          activity_path = Path('android-companion/app/src/main/java/com/sogyboi/inspirationboard/capture/CaptureBrowserActivity.kt')
          activity = activity_path.read_text()
          activity = activity.replace('import android.os.Bundle\n', 'import android.os.Bundle\nimport android.os.Looper\n', 1)
          activity = activity.replace('import java.util.UUID\n', 'import java.util.UUID\nimport java.util.concurrent.FutureTask\n', 1)
          activity = activity.replace(
              '    private val prefs by lazy { getSharedPreferences("capture-browser", MODE_PRIVATE) }\n',
              '    private val prefs by lazy { getSharedPreferences("capture-browser", MODE_PRIVATE) }\n\n'
              '    @Volatile\n'
              '    private var browserUserAgent = "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 InspirationBoardCapture/0.5.3"\n',
              1,
          )
          activity = activity.replace(
              '            userAgentString = "$userAgentString InspirationBoardCapture/0.5.2"\n'
              '        }\n'
              '        webView.webChromeClient = WebChromeClient()\n',
              '            userAgentString = "$userAgentString InspirationBoardCapture/0.5.3"\n'
              '        }\n'
              '        // WebView APIs are UI-thread-only. Snapshot the UA once for worker-thread HTTP calls.\n'
              '        browserUserAgent = webView.settings.userAgentString\n'
              '        webView.webChromeClient = WebChromeClient()\n',
              1,
          )
          helper_anchor = '''    private fun normalizeServer(value: String): String {
              val clean = value.trim().trimEnd('/')
              return if (clean.isBlank()) "" else clean
          }

'''
          helper_insert = helper_anchor + '''    private fun <T> uiValue(block: () -> T): T {
              if (Looper.myLooper() == Looper.getMainLooper()) return block()
              val task = FutureTask<T> { block() }
              runOnUiThread(task)
              return task.get()
          }

          private fun cookieFor(url: String): String =
              uiValue { CookieManager.getInstance().getCookie(url).orEmpty() }

'''
          if helper_anchor not in activity:
              raise SystemExit('normalizeServer helper anchor not found')
          activity = activity.replace(helper_anchor, helper_insert, 1)
          expected_ua_calls = activity.count('connection.setRequestProperty("User-Agent", webView.settings.userAgentString)')
          if expected_ua_calls != 2:
              raise SystemExit(f'Expected 2 worker-thread WebView user-agent reads, found {expected_ua_calls}')
          activity = activity.replace('connection.setRequestProperty("User-Agent", webView.settings.userAgentString)', 'connection.setRequestProperty("User-Agent", browserUserAgent)')
          activity = activity.replace('val existingCookie = CookieManager.getInstance().getCookie(server).orEmpty()', 'val existingCookie = cookieFor(server)', 1)
          activity = activity.replace('val webViewCookie = CookieManager.getInstance().getCookie(server).orEmpty()', 'val webViewCookie = cookieFor(server)', 1)
          activity = activity.replace(
              'CookieManager.getInstance().getCookie(value)?.takeIf { it.isNotBlank() }?.let { connection.setRequestProperty("Cookie", it) }',
              'cookieFor(value).takeIf { it.isNotBlank() }?.let { connection.setRequestProperty("Cookie", it) }',
              1,
          )
          activity_path.write_text(activity)

          gradle = Path('android-companion/app/build.gradle.kts')
          text = gradle.read_text()
          text = re.sub(r'versionCode = \d+', 'versionCode = 7', text, count=1)
          text = text.replace('versionName = "0.5.2"', 'versionName = "0.5.3"', 1)
          gradle.write_text(text)

          core = Path('capture-browser-core-v5.js')
          text = core.read_text().replace("'0.5.2'", "'0.5.3'", 1)
          text = text.replace('capture-browser-v0.5.2', 'capture-browser-v0.5.3', 1)
          core.write_text(text)

          launcher52 = Path('launcher-v52.js').read_text()
          Path('launcher-v53.js').write_text(launcher52.replace('0.5.2', '0.5.3'))

          manifest = Path('manifest.json')
          text = manifest.read_text().replace('"launcher-v52.js"', '"launcher-v53.js"', 1).replace('"version": "0.5.2"', '"version": "0.5.3"', 1)
          manifest.write_text(text)

          package = Path('package.json')
          text = package.read_text().replace('"version": "0.5.2"', '"version": "0.5.3"', 1)
          text = text.replace('node --check launcher-v52.js &&', 'node --check launcher-v52.js && node --check launcher-v53.js &&', 1)
          package.write_text(text)

          workflow = Path('.github/workflows/android-capture-browser.yml')
          text = workflow.read_text().replace('0.5.2', '0.5.3')
          text = text.replace('CSRF/session-aware native capture saving and real HTTP diagnostics.', 'CSRF/session-aware native capture saving, UI-thread-safe WebView access, and real HTTP diagnostics.')
          workflow.write_text(text)

          native_test = Path('tests/android-capture-native-v052.test.mjs')
          text = native_test.read_text().replace('v0.5.2', 'v0.5.3').replace('0\\.5\\.2', '0\\.5\\.3')
          native_test.write_text(text)

          core_test = Path('tests/capture-browser-core-v5.test.mjs')
          text = core_test.read_text().replace('v0.5.2', 'v0.5.3').replace("'0.5.2'", "'0.5.3'").replace('v0\\.5\\.2', 'v0\\.5\\.3')
          core_test.write_text(text)

          thread_test = '''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const source = fs.readFileSync(new URL('../android-companion/app/src/main/java/com/sogyboi/inspirationboard/capture/CaptureBrowserActivity.kt', import.meta.url), 'utf8');
          const networkStart = source.indexOf('private fun postCapture');
          const networkEnd = source.indexOf('private fun shareFallback');
          const networkSection = source.slice(networkStart, networkEnd);

          test('worker-thread networking never reads WebView APIs directly', () => {
            assert.ok(networkStart > 0 && networkEnd > networkStart);
            assert.doesNotMatch(networkSection, /webView\./);
            assert.doesNotMatch(networkSection, /CookieManager\.getInstance\(\)\.getCookie/);
            assert.match(networkSection, /browserUserAgent/);
            assert.match(networkSection, /cookieFor\(/);
          });

          test('UI bridge protects CookieManager reads used by native networking', () => {
            assert.match(source, /Looper\.myLooper\(\) == Looper\.getMainLooper\(\)/);
            assert.match(source, /FutureTask<T>/);
            assert.match(source, /runOnUiThread\(task\)/);
            assert.match(source, /uiValue \{ CookieManager\.getInstance\(\)\.getCookie/);
          });
          '''
          Path('tests/android-capture-thread-v053.test.mjs').write_text(thread_test)

          docs = Path('CAPTURE_BROWSER.md')
          text = docs.read_text()
          text = text.replace('# Android Capture Browser (v0.5.0)', '# Android Capture Browser (v0.5.3)', 1)
          note = '''\n## v0.5.3 thread-safety fix\n\nNative HTTP saving now snapshots the WebView user agent on the Android UI thread and marshals CookieManager reads back to that thread before worker-thread network requests. This fixes Android's `All WebView methods must be called on the same thread` failure while keeping the v0.5.2 CSRF/session handshake.\n'''
          if '## v0.5.3 thread-safety fix' not in text:
              text = text.replace('\n## Install\n', note + '\n## Install\n', 1)
          text = text.replace('v0.5.2', 'v0.5.3')
          docs.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''## 0.5.3\n\n- Fixed native Capture Browser direct saves failing with `All WebView methods must be called on the same thread`.\n- Removed all direct WebView access from background network operations.\n- Snapshotted the browser user agent on the UI thread and marshalled CookieManager reads safely through the UI thread.\n- Preserved the v0.5.2 CSRF/session handshake, real HTTP diagnostics, image-byte uploads, and Android Share fallback.\n- Added Android source regression tests that fail if worker-thread networking touches WebView or CookieManager directly.\n- Published `InspirationBoard-CaptureBrowser-v0.5.3.apk`.\n\n'''
          if not text.startswith('# Changelog\n\n## 0.5.3'):
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          changelog.write_text(text)

          # Remove this one-shot workflow and trigger from the final branch.
          Path('.github/workflows/apply-v053-thread-hotfix.yml').unlink(missing_ok=True)
          Path('ibv053-thread-trigger.txt').unlink(missing_ok=True)
          PY
      - name: Verify extension tests
        run: |
          npm test
          npm run check
      - name: Verify Android build
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle -p android-companion :app:assembleDebug
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hotfix v0.5.3 WebView thread safety"
          git push origin HEAD:hotfix/v0.5.3-webview-thread

name: Apply v0.2.0 payload

on:
  push:
    branches:
      - feature/v0.2.0-workspace
    paths:
      - v2_payload.part06

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.2.0-workspace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack release payload
        run: |
          cat v2_payload.part* | base64 -d > /tmp/inspiration-board-v2.zip
          unzip -o /tmp/inspiration-board-v2.zip
          rm -f v2_payload.part*
      - name: Verify release
        run: |
          npm test
          npm run check
      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Release Inspiration Board v0.2.0"
          git push origin HEAD:feature/v0.2.0-workspace

name: Apply v0.6.0 Venice media integration

on:
  push:
    branches:
      - feature/v0.6.0-venice-media
    paths:
      - ibv060-media-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.6.0-venice-media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Repair v0.6.0 patcher inputs
        run: python tools/prepare_v060_patcher.py
      - name: Apply v0.6.0 product wiring
        run: python tools/apply_v060_fixed.py
      - name: Verify full repository
        run: |
          npm test
          npm run check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            launcher-v60.js \
            openrouter-browser-v60.js \
            venice-gen-v60.js \
            manifest.json \
            package.json \
            CHANGELOG.md \
            VENICE_MEDIA_GENERATION.md \
            tests/venice-media-v060.test.mjs \
            server-plugin/inspiration-board-sync/index.mjs \
            server-plugin/inspiration-board-sync/venice-media-v60.mjs \
            server-plugin/inspiration-board-sync/README.md
          git commit -m "Release v0.6.0 Venice image and video generation"
          git push origin HEAD:feature/v0.6.0-venice-media
